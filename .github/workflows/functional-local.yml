name: Functional Local Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/functional-local.yml' ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4
      - name: Checkout proven local diffusion engine
        run: |
          git clone --depth 1 https://github.com/xororz/local-dream.git local-dream
          cd local-dream
          git submodule update --init --recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build local diffusion app
        working-directory: local-dream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Collect APK
        run: |
          mkdir -p output
          find local-dream -type f -name "*.apk" -exec cp {} output/ \;
          ls -lah output
      - name: Upload functional APK
        uses: actions/upload-artifact@v4
        with:
          name: Genny-Sophie-Local-Engine
          path: output/*.apk
          if-no-files-found: error
